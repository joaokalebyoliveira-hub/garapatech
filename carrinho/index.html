<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="SITE_GRPTECH/carrinho/style.css">
</head>
<body>
    <button id="cart-btn">🛒 Carrinho (<span id="cart-count">0</span>)</button>

<!-- O Pop-up do Carrinho (Modal) -->
<div id="cart-modal" class="modal-overlay hidden">
  <div class="cart-content">
    <button id="close-btn">&times; Fechar</button>
    <h2>Seu Carrinho</h2>
    
    <!-- Lista onde os itens serão adicionados -->
    <ul id="cart-items">
      <li class="empty-cart">Seu carrinho está vazio.</li>
    </ul>

    <!-- Exibição do Total -->
    <div class="cart-total">
      Total: R$ <span id="total-price">0.00</span>
    </div>
  </div>
</div>

<!-- Exemplo de botão de produto para simular adição -->
<button class="add-to-cart" data-name="Camiseta React" data-price="49.90">
  Adicionar Camiseta
</button>
</body>
</html>
